<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1026">
<title>Hover Racer</title>
<style>
  html,body{margin:0;height:100%;background:#0b1026;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, S;               // S = scale factor relative to a 400x700 design
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = Math.floor(innerWidth * dpr);
  H = cv.height = Math.floor(innerHeight * dpr);
  S = Math.min(W / 400, H / 700);
}
addEventListener('resize', resize); resize();

// ---------- difficulty ----------
const DIFFS = [
  { name: 'Easy',   color: '#7bed9f', gap: 300, space: 330, speed: 2.1, ramp: 0.02, cap: 0.8, hw: 22, hh: 6,  flip: 15 },
  { name: 'Normal', color: '#58e0ff', gap: 260, space: 300, speed: 2.5, ramp: 0.03, cap: 1.2, hw: 26, hh: 8,  flip: 10 },
  { name: 'Hard',   color: '#ffa502', gap: 210, space: 260, speed: 3.0, ramp: 0.05, cap: 1.8, hw: 30, hh: 10, flip: 8  },
  { name: 'Insane', color: '#ff4757', gap: 170, space: 230, speed: 3.6, ramp: 0.07, cap: 2.4, hw: 34, hh: 12, flip: 5  },
];
let dIdx = 0;   // Easy by default
try { const v = localStorage.getItem('hr_diff'); if (v !== null) dIdx = parseInt(v, 10); } catch(e){}
if (!(dIdx >= 0 && dIdx < DIFFS.length)) dIdx = 0;
let best = 0;
function loadBest(){
  best = 0;
  try { best = parseInt(localStorage.getItem('hr_best_' + dIdx) || '0', 10) || 0; } catch(e){}
}
loadBest();
function setDiff(i){
  dIdx = (i + DIFFS.length) % DIFFS.length;
  try { localStorage.setItem('hr_diff', String(dIdx)); } catch(e){}
  loadBest();
  beep(500, 0.05, 'triangle', 0.04);
}

const state = { mode: 'ready', score: 0, t: 0, flash: 0 };
let flipT = 0;   // 0 = normal world, 1 = upside down (declared early: reset() uses it)
const car = { x: 0, y: 0, vy: 0, rot: 0, boost: 0, kick: 0 };
let pipes = [], stars = [], particles = [];
let audioCtx = null;

for (let i = 0; i < 70; i++) stars.push({ x: Math.random(), y: Math.random() * 0.8, r: Math.random() * 1.6 + 0.3, s: Math.random() * 0.3 + 0.05 });

function beep(freq, dur, type='square', vol=0.05){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function reset(){
  car.x = W * 0.28; car.y = H * 0.45; car.vy = 0; car.rot = 0; car.boost = 0; car.kick = 0;
  pipes = []; particles = [];
  state.score = 0; state.t = 0; state.flash = 0; flipT = 0;
}
reset();

function flap(){
  if (state.mode === 'ready'){ state.mode = 'play'; }
  if (state.mode === 'play'){
    car.kick = 9;   // smooth lift over a few frames instead of an instant jump
    car.boost = 1;  // thrusters fire
    beep(520, 0.08, 'triangle', 0.06);
  } else if (state.mode === 'dead' && state.t > 30){
    reset(); state.mode = 'ready';
  }
}
function press(cx, cy){
  if (state.mode === 'ready'){
    const k = W / innerWidth;
    const x = cx * k, y = cy * k;
    if (Math.abs(y - H * 0.64) < 50 * S){
      if (x < W * 0.3){ setVeh(vIdx - 1); return; }
      if (x > W * 0.7){ setVeh(vIdx + 1); return; }
    }
    if (Math.abs(y - H * 0.76) < 40 * S){
      if (x < W * 0.3){ setDiff(dIdx - 1); return; }
      if (x > W * 0.7){ setDiff(dIdx + 1); return; }
    }
  }
  flap();
}
addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; press(t.clientX, t.clientY); }, { passive: false });
addEventListener('mousedown', e => press(e.clientX, e.clientY));
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); flap(); } });

const GRAV = 0.32;
let THRUSTER_X = [-22, 0, 22];
function spawnPipe(){
  const gap = DIFFS[dIdx].gap * S;
  const margin = 90 * S;
  const gy = margin + Math.random() * (H - gap - margin * 2 - 60 * S);
  pipes.push({ x: W + 60 * S, w: 64 * S, gapY: gy, gap, passed: false });
}

function die(){
  if (state.mode === 'dead') return;
  state.mode = 'dead'; state.t = 0;
  beep(140, 0.35, 'sawtooth', 0.08);
  if (state.score > best){
    best = state.score;
    try { localStorage.setItem('hr_best_' + dIdx, String(best)); } catch(e){}
  }
  for (let i = 0; i < 30; i++) particles.push({ x: car.x, y: car.y, vx: (Math.random()-0.5)*8*S, vy: (Math.random()-0.5)*8*S, life: 1, hot: true });
}

function diffSpeed(){
  const d = DIFFS[dIdx];
  return (d.speed + Math.min(state.score * d.ramp, d.cap)) * S;
}
function speedNow(){ return state.mode === 'play' ? diffSpeed() : 0; }

function update(){
  state.t++;
  // after 10 points the whole map flips upside down (animated)
  const flipTarget = state.score >= DIFFS[dIdx].flip ? 1 : 0;
  flipT += Math.max(-0.03, Math.min(0.03, flipTarget - flipT));
  if (state.flash > 0) state.flash--;
  car.boost *= state.mode === 'dead' ? 0.8 : 0.93;
  const speed = diffSpeed();

  if (state.mode === 'play' || state.mode === 'dead'){
    if (car.kick > 0 && state.mode === 'play'){
      car.vy += (-6.2 * S - car.vy) * 0.28;
      car.kick--;
    }
    car.vy += GRAV * S;
    car.vy = Math.min(car.vy, 7.5 * S);
    car.y += car.vy;
    const targetRot = Math.max(-0.45, Math.min(0.9, car.vy / (12 * S)));
    car.rot += (targetRot - car.rot) * 0.15;
  } else {
    car.y = H * 0.45 + Math.sin(state.t / 15) * 10 * S;
    car.rot = Math.sin(state.t / 15) * 0.08;
  }

  if (state.mode === 'play'){
    if (!pipes.length || pipes[pipes.length-1].x < W - DIFFS[dIdx].space * S) spawnPipe();
    for (const p of pipes){
      p.x -= speed;
      if (!p.passed && p.x + p.w < car.x){ p.passed = true; state.score++; beep(880, 0.07, 'sine', 0.06);
        if (state.score === DIFFS[dIdx].flip){ state.flash = 110; beep(220, 0.4, 'sawtooth', 0.06); } }
    }
    pipes = pipes.filter(p => p.x > -100 * S);

    // collision (forgiving hitbox)
    const hw = DIFFS[dIdx].hw * S, hh = DIFFS[dIdx].hh * S;
    for (const p of pipes){
      if (car.x + hw > p.x && car.x - hw < p.x + p.w){
        if (car.y - hh < p.gapY || car.y + hh > p.gapY + p.gap) die();
      }
    }
    if (car.y + hh > H - 50 * S || car.y - hh < 0) die();
  } else if (state.mode === 'dead'){
    if (car.y > H - 62 * S){ car.y = H - 62 * S; car.vy = 0; }
  }

  for (const s of stars){ s.x -= s.s * 0.0008 * (state.mode === 'play' ? 1 : 0.3); if (s.x < 0) s.x = 1; }
  // smoke plumes trailing down from the thrusters
  if (car.boost > 0.12 && state.mode !== 'dead' && state.t % 2 === 0){
    for (const nx of THRUSTER_X){
      const jetLen = (6 + car.boost * 70) * S;
      particles.push({
        x: car.x + nx * S + (Math.random() - 0.5) * 6 * S,
        y: car.y + 12 * S + jetLen * 0.7,
        vx: -(speedNow() * 0.6) + (Math.random() - 0.5) * 0.8 * S,
        vy: (0.8 + Math.random() * 1.2 + car.boost * 2) * S,
        life: 1, decay: 0.02, smoke: true, r: (4 + Math.random() * 4) * S
      });
    }
  }
  for (const q of particles){
    q.x += q.vx; q.y += q.vy; q.life -= q.decay || 0.03;
    if (q.smoke) q.r += 0.35 * S;
  }
  particles = particles.filter(q => q.life > 0);
}

// ---------- vehicle selection ----------
const VEHICLES = [
  { name: 'Hover Coupe', thr: [-22, 0, 22], draw: null },
  { name: 'Rocket Pod',  thr: [-16, 0, 16], draw: drawPod },
  { name: 'Saucer',      thr: [-20, 0, 20], draw: drawSaucer },
  { name: 'Dune Buggy',  thr: [-24, 24],    draw: drawBuggy },
];
let vIdx = 0;
try { vIdx = parseInt(localStorage.getItem('hr_veh') || '0', 10) || 0; } catch(e){}
if (vIdx < 0 || vIdx >= VEHICLES.length) vIdx = 0;
THRUSTER_X = VEHICLES[vIdx].thr;

function setVeh(i){
  vIdx = (i + VEHICLES.length) % VEHICLES.length;
  THRUSTER_X = VEHICLES[vIdx].thr;
  try { localStorage.setItem('hr_veh', String(vIdx)); } catch(e){}
  car.boost = 1;
  beep(660, 0.05, 'triangle', 0.04);
}

function drawThrusters(){
  if (car.boost <= 0.04) return;
  for (const nx of THRUSTER_X){
    const flick = 0.85 + Math.random() * 0.3;
    const len = (6 + car.boost * 70) * flick;
    const top = 12;
    const fg = ctx.createLinearGradient(0, top, 0, top + len);
    fg.addColorStop(0, 'rgba(255,255,255,0.95)');
    fg.addColorStop(0.2, 'rgba(140,235,255,0.9)');
    fg.addColorStop(0.65, 'rgba(60,130,255,0.5)');
    fg.addColorStop(1, 'rgba(60,130,255,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(nx - 3.5, top);
    ctx.quadraticCurveTo(nx - 5, top + len * 0.6, nx, top + len);
    ctx.quadraticCurveTo(nx + 5, top + len * 0.6, nx + 3.5, top);
    ctx.closePath(); ctx.fill();
  }
}

function drawNozzles(){
  ctx.fillStyle = '#1b2140';
  for (const x of THRUSTER_X) ctx.fillRect(x - 5, 9, 10, 4);
}

function drawPod(){
  const g = ctx.createLinearGradient(0, -14, 0, 12);
  g.addColorStop(0, '#f2f6ff'); g.addColorStop(1, '#7f93c9');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, -1, 40, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff9f1c';
  ctx.beginPath(); ctx.moveTo(30, -9); ctx.quadraticCurveTo(50, -1, 30, 7); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-32, -8); ctx.lineTo(-44, -20); ctx.lineTo(-22, -11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a3a78';
  ctx.beginPath(); ctx.arc(8, -3, 6.5, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(180,235,255,0.85)';
  ctx.beginPath(); ctx.arc(7, -4, 3.2, 0, 7); ctx.fill();
  drawNozzles();
}

function drawSaucer(){
  const g = ctx.createLinearGradient(0, -4, 0, 12);
  g.addColorStop(0, '#c9d3e6'); g.addColorStop(1, '#5d6a8c');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 3, 42, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(160,235,255,0.85)';
  ctx.beginPath(); ctx.ellipse(0, -1, 18, 14, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.ellipse(-6, -8, 5, 3, -0.4, 0, Math.PI * 2); ctx.fill();
  const t = state.t;
  for (let i = -3; i <= 3; i++){
    ctx.fillStyle = ((i + Math.floor(t / 8)) % 2 === 0) ? '#ffe066' : '#ff6b6b';
    ctx.beginPath(); ctx.arc(i * 11, 4 + Math.abs(i) * 0.4, 2, 0, 7); ctx.fill();
  }
  drawNozzles();
}

function drawBuggy(){
  ctx.fillStyle = '#ffc233';
  ctx.beginPath();
  ctx.moveTo(-36, 8);
  ctx.lineTo(-34, -2);
  ctx.lineTo(-12, -2);
  ctx.lineTo(-6, 4);
  ctx.lineTo(30, 4);
  ctx.quadraticCurveTo(40, 4, 38, 10);
  ctx.lineTo(-34, 11);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#333a5c'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-26, -2); ctx.lineTo(-22, -16); ctx.lineTo(4, -16); ctx.lineTo(12, 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-22, -16); ctx.lineTo(-10, -2); ctx.stroke();
  ctx.fillStyle = '#2a2f55';
  ctx.fillRect(-14, -9, 12, 7);
  ctx.fillStyle = '#fff7b0';
  ctx.beginPath(); ctx.ellipse(37, 5, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1b2140';
  for (const x of THRUSTER_X){
    ctx.beginPath(); ctx.ellipse(x, 11, 10, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#58e0ff';
    ctx.beginPath(); ctx.ellipse(x, 12, 6, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1b2140';
  }
}

function drawCar(){
  const v = VEHICLES[vIdx];
  if (!v.draw){ drawCoupe(); return; }
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.rot);
  ctx.scale(S, S);
  const glow = ctx.createRadialGradient(0, 14, 2, 0, 14, 46);
  glow.addColorStop(0, 'rgba(80,220,255,0.55)');
  glow.addColorStop(1, 'rgba(80,220,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.ellipse(0, 14, 46, 14, 0, 0, Math.PI * 2); ctx.fill();
  drawThrusters();
  v.draw();
  ctx.restore();
}

function drawCoupe(){
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.rot);
  ctx.scale(S, S);

  // underglow
  const glow = ctx.createRadialGradient(0, 14, 2, 0, 14, 46);
  glow.addColorStop(0, 'rgba(80,220,255,0.55)');
  glow.addColorStop(1, 'rgba(80,220,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.ellipse(0, 14, 46, 14, 0, 0, Math.PI*2); ctx.fill();

  // downward thrusters: three jets under the car, longer on each boost
  if (car.boost > 0.04){
    for (const nx of THRUSTER_X){
      const flick = 0.85 + Math.random() * 0.3;
      const len = (6 + car.boost * 70) * flick;
      const top = 12;
      const fg = ctx.createLinearGradient(0, top, 0, top + len);
      fg.addColorStop(0, 'rgba(255,255,255,0.95)');
      fg.addColorStop(0.2, 'rgba(140,235,255,0.9)');
      fg.addColorStop(0.65, 'rgba(60,130,255,0.5)');
      fg.addColorStop(1, 'rgba(60,130,255,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(nx - 3.5, top);
      ctx.quadraticCurveTo(nx - 5, top + len * 0.6, nx, top + len);
      ctx.quadraticCurveTo(nx + 5, top + len * 0.6, nx + 3.5, top);
      ctx.closePath(); ctx.fill();
    }
  }

  // body
  const body = ctx.createLinearGradient(0, -16, 0, 14);
  body.addColorStop(0, '#ff5a4f');
  body.addColorStop(1, '#a3141e');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-38, 6);
  ctx.quadraticCurveTo(-40, -2, -26, -5);
  ctx.lineTo(-10, -13);
  ctx.quadraticCurveTo(2, -17, 14, -11);
  ctx.lineTo(28, -4);
  ctx.quadraticCurveTo(42, -1, 40, 7);
  ctx.quadraticCurveTo(38, 12, 30, 12);
  ctx.lineTo(-30, 12);
  ctx.quadraticCurveTo(-38, 12, -38, 6);
  ctx.closePath(); ctx.fill();

  // canopy
  ctx.fillStyle = 'rgba(180,235,255,0.9)';
  ctx.beginPath();
  ctx.moveTo(-8, -5); ctx.lineTo(-3, -11);
  ctx.quadraticCurveTo(5, -14, 12, -10);
  ctx.lineTo(18, -5); ctx.closePath(); ctx.fill();

  // side line
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-30, 3); ctx.lineTo(32, 3); ctx.stroke();

  // headlight + taillight
  ctx.fillStyle = '#fff7b0';
  ctx.beginPath(); ctx.ellipse(37, 3, 3.5, 2, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff2b4a';
  ctx.fillRect(-39, 0, 3, 5);

  // hover pods instead of wheels
  ctx.fillStyle = '#1b2140';
  for (const wx of [-22, 22]){
    ctx.beginPath(); ctx.ellipse(wx, 12, 9, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#58e0ff';
    ctx.beginPath(); ctx.ellipse(wx, 13, 6, 2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1b2140';
  }
  ctx.restore();
}

function drawPipe(p){
  const grad = ctx.createLinearGradient(p.x, 0, p.x + p.w, 0);
  grad.addColorStop(0, '#1a2a6c'); grad.addColorStop(0.5, '#3b5bdb'); grad.addColorStop(1, '#1a2a6c');
  ctx.fillStyle = grad;
  const capH = 22 * S;
  ctx.fillRect(p.x, 0, p.w, p.gapY);
  ctx.fillRect(p.x, p.gapY + p.gap, p.w, H);
  ctx.fillStyle = '#58e0ff';
  ctx.fillRect(p.x - 5*S, p.gapY - capH, p.w + 10*S, capH);
  ctx.fillRect(p.x - 5*S, p.gapY + p.gap, p.w + 10*S, capH);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(p.x - 5*S, p.gapY - 4*S, p.w + 10*S, 3*S);
  ctx.fillRect(p.x - 5*S, p.gapY + p.gap + capH - 4*S, p.w + 10*S, 3*S);
}

function text(str, x, y, size, color='#fff', align='center'){
  ctx.fillStyle = color; ctx.textAlign = align;
  ctx.font = `bold ${size * S}px system-ui, sans-serif`;
  ctx.fillText(str, x, y);
}

function draw(){
  // world is drawn through a vertical flip; the HUD below is drawn unflipped
  ctx.save();
  ctx.translate(0, H / 2);
  ctx.scale(1, Math.cos(Math.PI * flipT));
  ctx.translate(0, -H / 2);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0b1026'); sky.addColorStop(0.7, '#2b1b5a'); sky.addColorStop(1, '#ff6b6b');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#fff';
  for (const s of stars){ ctx.globalAlpha = 0.4 + s.r / 3; ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r * S, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;

  for (const p of pipes) drawPipe(p);

  // ground
  ctx.fillStyle = '#10142e'; ctx.fillRect(0, H - 50*S, W, 50*S);
  ctx.fillStyle = '#58e0ff'; ctx.fillRect(0, H - 50*S, W, 3*S);
  ctx.fillStyle = 'rgba(88,224,255,0.4)';
  const off = (state.t * 4 * S) % (40 * S);
  for (let x = -off; x < W; x += 40 * S) ctx.fillRect(x, H - 30*S, 20*S, 3*S);

  for (const q of particles){
    if (q.smoke){
      ctx.globalAlpha = Math.max(q.life, 0) * 0.35;
      ctx.fillStyle = '#e8eef7';
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill();
      continue;
    }
    ctx.globalAlpha = Math.max(q.life, 0);
    ctx.fillStyle = q.hot ? '#ffb347' : '#58e0ff';
    ctx.beginPath(); ctx.arc(q.x, q.y, 3 * S, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawCar();
  ctx.restore();

  if (state.mode === 'play'){
    text(String(state.score), W/2, 90*S, 56, '#fff');
    if (state.flash > 0){
      ctx.globalAlpha = Math.min(1, state.flash / 30);
      text('WORLD FLIP!', W/2, H*0.3, 40, '#ffd166');
      ctx.globalAlpha = 1;
    }
  } else if (state.mode === 'ready'){
    text('HOVER RACER', W/2, H*0.2, 40);
    text('Tap to boost', W/2, H*0.2 + 40*S, 22, '#58e0ff');
    text(VEHICLES[vIdx].name, W/2, H*0.64 + 8*S, 24);
    text('Choose vehicle', W/2, H*0.64 - 26*S, 14, '#b8c4ee');
    ctx.fillStyle = '#58e0ff';
    const ay = H * 0.64;
    ctx.beginPath(); ctx.moveTo(W*0.12, ay); ctx.lineTo(W*0.12 + 16*S, ay - 14*S); ctx.lineTo(W*0.12 + 16*S, ay + 14*S); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W*0.88, ay); ctx.lineTo(W*0.88 - 16*S, ay - 14*S); ctx.lineTo(W*0.88 - 16*S, ay + 14*S); ctx.closePath(); ctx.fill();
    const dy = H * 0.76, dd = DIFFS[dIdx];
    text('Difficulty', W/2, dy - 26*S, 14, '#b8c4ee');
    text(dd.name, W/2, dy + 8*S, 24, dd.color);
    ctx.fillStyle = dd.color;
    ctx.beginPath(); ctx.moveTo(W*0.12, dy); ctx.lineTo(W*0.12 + 16*S, dy - 14*S); ctx.lineTo(W*0.12 + 16*S, dy + 14*S); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W*0.88, dy); ctx.lineTo(W*0.88 - 16*S, dy - 14*S); ctx.lineTo(W*0.88 - 16*S, dy + 14*S); ctx.closePath(); ctx.fill();
    text('Best (' + dd.name + '): ' + best, W/2, H*0.87, 20, '#ffd', 'center');
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    text('CRASHED', W/2, H*0.34, 46, '#ff6b6b');
    text('Score: ' + state.score, W/2, H*0.34 + 56*S, 30);
    text('Best: ' + best, W/2, H*0.34 + 96*S, 24, '#ffd');
    if (state.t > 30) text('Tap to retry', W/2, H*0.34 + 150*S, 24, '#58e0ff');
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
